name: monrezo_mvp
description: Prototype d'application voyageurs pour le réseau monRéZO (Pluriface).
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Position de l'''usager, pour proposer l'''arrêt le plus proche (écran Prochains passages).
  geolocator: ^13.0.0
  shared_preferences: ^2.2.0
  # Composer un numéro et ouvrir un lien officiel : l'écran Plan et infos porte le numéro du
  # transport à la demande et celui des boutiques. Recopier un numéro à la main, debout à un
  # arrêt, n'est pas une option. Repli prévu dans le code si l'ouverture échoue.
  url_launcher: ^6.3.0
  # Alarme d'arrivee : l'ecran doit rester allume tant qu'elle est armee. Sans cela
  # Android suspend l'application des que l'ecran s'eteint, et l'alarme ne sonne jamais —
  # une alarme qui ne reveille pas est pire que pas d'alarme. La seule autre voie est un
  # service d'arriere-plan, qui exige ACCESS_BACKGROUND_LOCATION : une permission
  # effrayante, et contraire a l'argument « cette application ne demande presque rien ».
  # wakelock_plus ne declare que WAKE_LOCK, permission normale, et aucun acces reseau.
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/network.json
    - assets/data/alerts.json
    - assets/data/fares.json
    - assets/data/places.json
